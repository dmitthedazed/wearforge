name: Feature request
description: Ideas and improvements
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: What should WearForge do, and why is it useful for you?
    validations:
      required: true

  - type: input
    id: watch
    attributes:
      label: Watch
      description: If it's about a specific model.
      placeholder: Pixel Watch 3
