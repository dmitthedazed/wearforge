name: Bug report
description: Something doesn't work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead.
    validations:
      required: true

  - type: input
    id: watch
    attributes:
      label: Watch
      placeholder: Galaxy Watch6, Wear OS 5
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Your OS
      options: [Linux, macOS, Windows, Termux]
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: WearForge version
      description: Output of `wearforge --version`
      placeholder: WearForge 1.3.0

  - type: textarea
    id: log
    attributes:
      label: Log
      description: |
        The end of `wearforge.log`. It's in `~/.local/share/wearforge` (Linux),
        `~/Library/Application Support/WearForge` (macOS) or `%LOCALAPPDATA%\WearForge` (Windows).
      render: text
